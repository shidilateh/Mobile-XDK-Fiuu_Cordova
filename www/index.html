<html>
  <head>
    <meta charset="utf-8" />
    <!--
        Customize this policy to fit your own app's needs. For more guidance, please refer to the docs:
            https://cordova.apache.org/docs/en/latest/
        Some notes:
            * https://ssl.gstatic.com is required only on Android and is needed for TalkBack to function properly
            * Disables use of inline scripts in order to mitigate risk of XSS vulnerabilities. To change this:
                * Enable inline JS: add 'unsafe-inline' to default-src
        -->

    <meta
      http-equiv="Content-Security-Policy"
      content="default-src * 'self' data: gap: https://localhost http://localhost ws://localhost; style-src * 'self' 'unsafe-inline'; script-src * 'self' 'unsafe-inline' 'unsafe-eval'; media-src *"
    />

    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' data: https://ssl.gstatic.com 'unsafe-eval'; style-src 'self' 'unsafe-inline'; media-src *; img-src 'self' data: content:;"
    />
    <!-- <meta http-equiv="Content-Security-Policy"
          content="default-src * 'self' data: blob:; style-src * 'self' 'unsafe-inline'; script-src * 'self' 'unsafe-inline' 'unsafe-eval'"> -->

    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />

    <meta name="color-scheme" content="light dark" />
    <link
      href="css/bootstrap.min.css"
      rel="stylesheet"
      crossorigin="anonymous"
    />
    <link
      href="css/bootstrap-icons.css"
      rel="stylesheet"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="css/index.css" />
    <title>XDK Fiuu Cordova Demo</title>
  </head>
  <body>
    <nav class="navbar appbar fixed-top">
      <div
        class="container-fluid d-flex justify-content-between align-items-center"
      >
        <span class="navbar-brand mb-0 h1 text-white">XDK Fiuu Cordova</span>
        <button class="btn" id="btnSettings">
          <i class="bi bi-gear-fill fs-4 text-white"></i>
        </button>
      </div>
    </nav>
    <div
      class="modal fade"
      id="settingToggleModal"
      aria-hidden="true"
      aria-labelledby="settingToggleModalLabel"
      tabindex="-1"
    >
      <div class="modal-dialog modal-fullscreen h-100">
        <div class="modal-content h-100"></div>
      </div>
    </div>

    <!-- Main Content -->
    <div class="container" id="contentBox">
      <h6 class="text-white">Console</h6>
      <pre
        id="console-payment"
        class="console-payment"
        aria-live="polite"
      ></pre>
      <div class="d-grid gap-2">
        <button class="btn btn-primary" id="validBtn">
          Pay with <strong>Valid</strong> payload
        </button>
        <button class="btn btn-danger" id="missingBtn">
          Pay with <strong>Missing</strong> fields
        </button>
      </div>
    </div>
  </body>
  <script src="js/bootstrap.min.js"></script>
  <script src="js/env.js"></script>
  <script src="js/platformNavigator.js"></script>
  <script src="js/common.js"></script>
  <script src="js/data.js"></script>
  <script src="cordova.js"></script>
  <script src="js/index.js"></script>
</html>
